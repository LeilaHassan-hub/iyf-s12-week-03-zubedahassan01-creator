  <main class="page-content">
    <p class="eyebrow">Say hello</p>
    <h1>Contact</h1>
    <p class="lead">This sample form shows the information a contact form needs. It is a front-end example and does not send messages yet.</p>
    <form class="contact-form" action="#" method="get">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button class="button" type="submit">Prepare message</button>
    </form>
  </main>
  <footer class="site-footer"><p>Learning, practicing, and building step by step.</p></footer>
</body>
